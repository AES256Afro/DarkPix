name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run test:budget
      - run: bash -n scripts/deploy-bigbox.sh
      - run: docker compose config --quiet
      - run: docker build -t darkpix-web:ci .
      - name: Smoke-test production container
        run: |
          container_id="$(docker run -d -p 127.0.0.1:18092:8080 darkpix-web:ci)"
          cleanup() { docker stop "$container_id" >/dev/null; }
          trap cleanup EXIT
          for attempt in {1..15}; do
            if curl -fsS http://127.0.0.1:18092/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          test "$(curl -fsS http://127.0.0.1:18092/healthz)" = "ok"
          test "$(curl -fsS http://127.0.0.1:18092/version.txt)" = "dev"
          curl -fsSI http://127.0.0.1:18092/version.txt | grep -qi '^cache-control: no-store'
          asset_path="$(curl -fsS http://127.0.0.1:18092/ | sed -n 's/.*src="\([^"]*\.js\)".*/\1/p' | head -n 1)"
          test -n "$asset_path"
          curl -fsSI "http://127.0.0.1:18092$asset_path" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          curl -fsSI http://127.0.0.1:18092/ | grep -qi '^x-frame-options: DENY'
          curl -fsSI http://127.0.0.1:18092/ | grep -qi '^strict-transport-security: max-age=31536000'
          curl -fsSI http://127.0.0.1:18092/ | grep -qi '^x-content-type-options: nosniff'
          curl -fsSI http://127.0.0.1:18092/ | grep -qi '^referrer-policy: strict-origin-when-cross-origin'
          curl -fsSI http://127.0.0.1:18092/ | grep -qi '^permissions-policy: camera=(), microphone=(), geolocation=(), payment=()'
          curl -fsSI http://127.0.0.1:18092/ | grep -qi "^content-security-policy:.*default-src 'self'.*frame-ancestors 'none'"
          curl -fsSI http://127.0.0.1:18092/ | grep -qi '^cross-origin-opener-policy: same-origin'
          curl -fsSI http://127.0.0.1:18092/ | grep -qi '^cross-origin-resource-policy: same-origin'
          curl -fsS http://127.0.0.1:18092/manifest.webmanifest | grep -q '"short_name": "DarkPix"'
          curl -fsS http://127.0.0.1:18092/sw.js | grep -q 'SKIP_WAITING'
          curl -fsSI 'http://127.0.0.1:18092/sw.js?v=dev' | grep -qi '^cache-control: no-store, max-age=0, must-revalidate'
          curl -fsSI 'http://127.0.0.1:18092/sw.js?v=dev' | grep -qi '^cloudflare-cdn-cache-control: no-store'
